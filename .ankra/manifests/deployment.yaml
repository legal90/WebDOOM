apiVersion: v1
kind: ServiceAccount
metadata:
  name: webdoom
  labels:
    app.kubernetes.io/name: webdoom
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webdoom
  labels:
    app.kubernetes.io/name: webdoom
  annotations:
    ankra.io/generated: "true"
spec:
  replicas: 1
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: webdoom
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webdoom
    spec:
      serviceAccountName: webdoom
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ankra-registry-pull
      containers:
        - name: webdoom
          image: registry.ankra.cloud/org-4ee02739-2825-4c25-8a91-d2b449c9c83e/webdoom:${{ ankra.image_tag }}
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ANKRA_RELEASE
              value: "${{ ankra.image_tag }}"
            - name: MACOSX_DEPLOYMENT_TARGET
              valueFrom:
                secretKeyRef:
                  name: webdoom-env
                  key: MACOSX_DEPLOYMENT_TARGET
                  optional: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: http
            failureThreshold: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
